# The unwrap engine (lib) and the HTTP server the editor talks to (bin).
[package]
name = "barista"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "barista-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lz4_flex = "0.11"
png = "0.17"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }

# The solver is all tight float loops: unoptimised builds are ~20x slower, too slow even for tests.
[profile.dev]
opt-level = 2

# SQLite's C source (.barista projects) built without debug info: cl's /Z7 can fail on it ("failed to get command
# line into debug records") and nobody steps through sqlite3.c.
[profile.dev.package.libsqlite3-sys]
debug = false
